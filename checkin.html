<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>출석 체크</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.desc { color: #64748b; font-size: 0.9rem; margin-top: 0; margin-bottom: 24px; }
  select, button {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    margin-bottom: 12px;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    font-size: 0.95rem;
    padding: 12px;
    border-radius: 10px;
  }
  .status.success { background: #dcfce7; color: #166534; }
  .status.already { background: #fef9c3; color: #854d0e; }
  .status.error { background: #fee2e2; color: #991b1b; }
  .confirm-name { font-size: 1.1rem; font-weight: 700; margin: 8px 0 20px; }
  .switch-user {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #94a3b8;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ 출석 체크</h1>
    <p class="desc" id="classLabel">확인 중...</p>

    <div id="selectStep" style="display:none;">
      <select id="nameSelect">
        <option value="">본인 이름을 선택하세요</option>
      </select>
      <button id="checkinBtn" disabled>출석하기</button>
    </div>

    <div id="quickStep" style="display:none;">
      <p style="color:#64748b; margin-bottom:4px;">저장된 이름</p>
      <div class="confirm-name" id="savedNameEl"></div>
      <button id="quickCheckinBtn">이 이름으로 출석하기</button>
      <button class="switch-user" id="switchUserBtn">다른 사람인가요? 이름 다시 선택</button>
    </div>

    <div id="statusBox"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig, STUDENTS } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const classId = params.get("class");

    const classLabel = document.getElementById("classLabel");
    const statusBox = document.getElementById("statusBox");
    const selectStep = document.getElementById("selectStep");
    const quickStep = document.getElementById("quickStep");
    const nameSelect = document.getElementById("nameSelect");
    const checkinBtn = document.getElementById("checkinBtn");
    const quickCheckinBtn = document.getElementById("quickCheckinBtn");
    const savedNameEl = document.getElementById("savedNameEl");
    const switchUserBtn = document.getElementById("switchUserBtn");

    let savedName = null;

    if (!classId) {
      classLabel.textContent = "잘못된 접근입니다. QR코드를 다시 스캔해주세요.";
    } else {
      classLabel.textContent = "출석할 이름을 선택해주세요";

      STUDENTS.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        nameSelect.appendChild(opt);
      });

      nameSelect.addEventListener("change", () => {
        checkinBtn.disabled = !nameSelect.value;
      });

      savedName = localStorage.getItem("attendance_student_name");
      if (savedName && STUDENTS.includes(savedName)) {
        savedNameEl.textContent = savedName;
        quickStep.style.display = "block";
      } else {
        selectStep.style.display = "block";
      }
    }

    switchUserBtn.addEventListener("click", () => {
      quickStep.style.display = "none";
      selectStep.style.display = "block";
    });

    async function doCheckin(name) {
      if (!classId) return;
      statusBox.innerHTML = "";
      checkinBtn.disabled = true;
      quickCheckinBtn.disabled = true;

      try {
        const ref = doc(db, "classes", classId, "attendance", name);
        const existing = await getDoc(ref);

        if (existing.exists()) {
          statusBox.innerHTML = `<div class="status already">이미 출석 처리되었습니다. (${name})</div>`;
        } else {
          await setDoc(ref, { name, checkedInAt: serverTimestamp() });
          statusBox.innerHTML = `<div class="status success">${name}님, 출석이 완료되었습니다! 🎉</div>`;
        }
        localStorage.setItem("attendance_student_name", name);
      } catch (err) {
        console.error(err);
        statusBox.innerHTML = `<div class="status error">오류가 발생했습니다: ${err.message}</div>`;
      } finally {
        checkinBtn.disabled = false;
        quickCheckinBtn.disabled = false;
      }
    }

    checkinBtn.addEventListener("click", () => {
      if (nameSelect.value) doCheckin(nameSelect.value);
    });

    quickCheckinBtn.addEventListener("click", () => {
      if (savedName) doCheckin(savedName);
    });
  </script>
</body>
</html>
